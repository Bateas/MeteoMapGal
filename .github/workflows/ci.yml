name: CI

# Build + test on every push to master and on every PR.
# Uses Node 24 (matches local dev and the deploy host).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token for every job: none of them writes to the repository, so a
# hijacked action gets nothing to write with.
permissions:
  contents: read

concurrency:
  # Cancel in-progress runs when a new commit is pushed to the same branch/PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    # Second net behind the local pre-commit hook: the same scanner over every
    # tracked file. A hit here means something already reached the public
    # repository and must be treated as leaked, not merely fixed.
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan tracked files
        run: bash tools/security-scan.sh tree

  test:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (root)
        # `npm ci`: install exactly the lockfile, nothing resolved fresh from
        # the registry at build time (that is what the Dependabot cooldown
        # protects, and `npm install` quietly bypassed it). The old reason
        # for `npm install` was a lockfile generated on Windows lacking the
        # Linux-only packages; both lockfiles carry them now. If this ever
        # fails with EUSAGE, regenerate the lockfile on Linux, do not relax.
        # .npmrc sets ignore-scripts=true (supply-chain hardening) so the
        # esbuild postinstall is re-run explicitly with the override.
        run: |
          npm ci --no-audit --no-fund
          npm rebuild esbuild --foreground-scripts --ignore-scripts=false

      - name: Install dependencies (ingestor)
        # Same `npm install` approach — ingestor has sharp too. vitest picks
        # up ingestor/**/*.test.ts which imports from pg, so deps must be
        # resolvable on the runner.
        run: |
          cd ingestor && npm ci --no-audit --no-fund
          npm rebuild esbuild sharp --foreground-scripts --ignore-scripts=false

      - name: Run tests (Vitest)
        run: |
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/test-output.log
          test_exit=${PIPESTATUS[0]}
          if [ $test_exit -ne 0 ]; then
            echo "::group::Failing tests"
            grep -E "(FAIL|×|✗|Error:)" /tmp/test-output.log | head -20 | while read line; do
              echo "::error::$line"
            done
            echo "::endgroup::"
          fi
          exit $test_exit
        env:
          CI: true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-output
          path: /tmp/test-output.log
          retention-days: 7

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Bundle size report
        run: |
          echo "### Bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----:|--------:|" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/main-*.js dist/assets/maplibre-*.js dist/assets/recharts-*.js; do
            if [ -f "$f" ]; then
              name=$(basename "$f" | sed 's/-[A-Za-z0-9_-]*\.js$//')
              size=$(stat -c%s "$f" | numfmt --to=iec)
              gz=$(gzip -c "$f" | wc -c | numfmt --to=iec)
              echo "| $name | $size | $gz |" >> $GITHUB_STEP_SUMMARY
            fi
          done
