# ── Rate limiting zones ─────────────────────────────
# Behind Cloudflare Tunnel: $binary_remote_addr is the tunnel IP (same for all users).
# Use CF-Connecting-IP header for real per-user rate limiting.
# Fallback to $binary_remote_addr if header missing (direct access / dev).
map $http_cf_connecting_ip $rate_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# Third-party answers we proxy carry no cache headers of their own (and some
# carry a session cookie, see below). This is what we tell the browser and the
# edge about them: one minute for a good answer, nothing at all for a failure,
# so a provider coming back is not hidden behind a cached error.
map $status $thirdparty_cache_control {
    200     "public, max-age=60";
    default "no-store";
}

# Lightning is the one stream a delay can matter in, so it gets half a minute
# and no more, even though it is also the one a crowd hits hardest.
map $status $lightning_cache_control {
    200     "public, max-age=30";
    default "no-store";
}

limit_req_zone $rate_limit_key zone=api_limit:10m rate=50r/s;
limit_req_zone $rate_limit_key zone=webhook_limit:5m rate=1r/m;  # 1 req/min per user for webhooks (feedback/alerts)

# ── Proxy cache — reduces external API load ─────────
# AEMET rate-limits aggressively (~100 req/min). Cache responses so N users
# hitting the same endpoint share 1 upstream request per cache window.
# 50MB zone, keys by URI+args. Inactive entries purged after 10min.
proxy_cache_path /var/cache/nginx/aemet levels=1:2 keys_zone=aemet_cache:10m max_size=50m inactive=10m;
proxy_cache_path /var/cache/nginx/meteogalicia levels=1:2 keys_zone=mg_cache:10m max_size=50m inactive=10m;
# Tide tables are astronomical: a given day's table never changes, so the last
# good copy is kept for days and served whenever the IHM is failing.
proxy_cache_path /var/cache/nginx/ihm levels=1:2 keys_zone=ihm_cache:5m max_size=20m inactive=3d;
# Everything else we proxy to a third party. A reload must not cost that third
# party a request: one shared zone, short TTLs, and NO 5xx in use_stale (with
# it, once an entry expires a failing upstream is asked on every request and
# the entry is never refreshed — measured on the tide route, 22-sep).
proxy_cache_path /var/cache/nginx/src levels=1:2 keys_zone=src_cache:10m max_size=100m inactive=30m;

# ── CORS origin whitelist ─────────────────────────
# Only allow requests from our own domains (not open relay).
map $http_origin $cors_origin {
    default "";
    "http://localhost:5173"               $http_origin;
    "https://meteomapgal.navia3d.com"     $http_origin;
}

server {
    listen 80;
    server_name _;

    root /var/www/meteomapgal;
    index index.html;

    # When our own rate limit refuses a request, say so: 429 Too Many
    # Requests. The default is 503, which reads as the server being down —
    # a burst of tile requests the limiter turned away looked like an outage
    # of the wave model, and fired 5xx alerts for something that was working.
    limit_req_status 429;

    # ── Security headers ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https: wss: data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'" always;

    # Probes for files and panels that do not exist here answer 404, not 444.
    # 444 closes the connection without a reply, and behind the tunnel the
    # edge turns an empty reply into a 502: every scan looked like the server
    # failing, raised 5xx alerts, and hid from the scan detector, which counts
    # 404s. A 404 is also the honest answer: there is nothing there.

    # ── Block dotfiles (except .well-known for ACME/SSL) ──
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ── Block CMS exploits, admin panels, scanner targets ──
    location ~* ^/(admin|wp-admin|wp-login|wp-content|wp-includes|wp-config|xmlrpc|phpmyadmin|server-status|server-info|cgi-bin|console|shell|install|setup|backup|dump|database|actuator|solr|manager|jmx-console) {
        return 404;
    }

    # ── Block dangerous file extensions ────────────────
    location ~* \.(sql|bak|old|orig|save|swp|log|ini|conf|sh|py|pl|rb|php|asp|aspx|jsp|cgi|env)$ {
        return 404;
    }

    # ── Gzip compression ─────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Static assets — long cache (Vite hashes filenames) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── PWA assets ───────────────────────────────────
    location /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }

    # /aemet-api/ and /aemet-data/ removed 22-sep: the app asks the API for AEMET
    # (/api/v1/aemet, /api/v1/aemet-data), which signs the request with our key
    # server side. Left open they were a free relay to AEMET from our address.

    # ── MeteoGalicia API proxy (cached 3min) ─────────
    location /meteogalicia-api/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass https://servizos.meteogalicia.gal/;
        proxy_ssl_server_name on;
        proxy_set_header Host servizos.meteogalicia.gal;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;

        # Fast timeouts: fail fast if upstream is slow and serve stale cache
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;

        proxy_cache mg_cache;
        proxy_cache_valid 200 3m;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        # No http_5xx here: with it, an expired entry is served stale WITHOUT
        # being replaced, so every request goes upstream anyway (measured on
        # the tide route, 22-sep). proxy_cache_lock makes a crowd arriving on
        # a cold entry cost ONE request upstream, not one each.
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # MeteoSIX v5: reuses /meteogalicia-api/ via /meteogalicia-api/apiv5/ path (no separate route needed)

    # ── Meteoclimatic API proxy ──────────────────────
    location /meteoclimatic-api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://www.meteoclimatic.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.meteoclimatic.net;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 3m;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── Netatmo API proxy ────────────────────────────
    location /netatmo-api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://app.netatmo.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host app.netatmo.net;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 3m;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    location /netatmo-auth/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass https://auth.netatmo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.netatmo.com;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
    }

    # ── Lightning / meteo2api proxy ──────────────────
    location /meteo2api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://apis-ext.xunta.gal/meteo2api/;
        proxy_ssl_server_name on;
        proxy_set_header Host apis-ext.xunta.gal;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $lightning_cache_control always;
    }

    # /eumetsat-api/ removed 22-sep: dropped when the licence turned out to be
    # non-commercial. /ideg-api/ removed too: no caller left in the code.

    # ── ENAIRE airspace proxy ──────────────────────
    location /enaire-api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://servais.enaire.es/;
        proxy_ssl_server_name on;
        proxy_set_header Host servais.enaire.es;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_valid any 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── Puertos del Estado buoy data proxy ──────────
    location /portus-api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://portus.puertos.es/portussvr/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host portus.puertos.es;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid any 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── Observatorio Costeiro da Xunta proxy ────────
    # Air quality (Xunta): only the one layer we read, never the whole host.
    # The client used to ask the provider's domain straight from the visitor's
    # browser, so nothing of ours could cache it and every visitor paid their
    # own request. Ten minutes here: the index is published hourly.
    location /ica-api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass https://ideg.xunta.gal/meteogalicia/rest/services/METEO2_WS/Observacion_Predicion_Calidad_Aire/MapServer/1/;
        proxy_ssl_server_name on;
        proxy_set_header Host ideg.xunta.gal;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid any 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # /obscosteiro-api/ removed 23-sep: the app reads the coastal observatory
    # through /api/v1/obscosteiro, so nothing called this one. It was also
    # handing the visitor a session cookie from the provider, which stops both
    # our cache and the edge from ever storing an answer.

    # ── SkyX personal weather station proxy ─────────
    location /skyx-api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass https://api.skyxglobal.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.skyxglobal.com;
        proxy_set_header X-Auth "a21bd737-a714-4a5c-9b08-e7d3d2693a51";
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 2m;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── NOAA CPC — NAO/AO teleconnection indices ────────
    location /noaa-api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass https://ftp.cpc.ncep.noaa.gov/;
        proxy_ssl_server_name on;
        proxy_set_header Host ftp.cpc.ncep.noaa.gov;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 6h;
        proxy_cache_valid any 5m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── IHM / Puertos del Estado tide proxy ────────
    location /ihm-api/ {
        limit_req zone=api_limit burst=80 nodelay;
        proxy_pass https://ideihm.covam.es/;
        proxy_ssl_server_name on;
        proxy_set_header Host ideihm.covam.es;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;

        # A table for a given date never changes, so a good answer is kept for
        # days and an error for one minute: while the IHM is down it gets at
        # most one request per URL per minute, whatever the traffic.
        # No http_5xx in use_stale: with it, once a cached error expired, every
        # later 500 served the stale entry WITHOUT replacing it, so every
        # request went upstream again (measured 22-sep: only the first 30 s of
        # each URL was ever served from cache).
        proxy_cache ihm_cache;
        proxy_cache_valid 200 3d;
        proxy_cache_valid any 1m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── MeteoMapGal History API (local) ─────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS handled by API server — hide nginx CORS
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ── GoAccess real-time analytics (WebSocket) ───
    location /goaccess {
        # Behind the Cloudflare Tunnel EVERY visitor arrives from 127.0.0.1,
        # so the allow list below matched the whole internet. Anything that
        # came through the tunnel carries CF-Connecting-IP: drop it. Only a
        # direct LAN connection (no tunnel, no header) gets through.
        # 404, not 444: through the tunnel a closed connection becomes a 502
        # at the edge, and a 404 does not even admit the page exists.
        if ($http_cf_connecting_ip != "") { return 404; }
        allow 192.168.10.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── n8n webhook proxy ──────────────────────────
    # Rate limited: 1 req/min per user (feedback spam protection)
    #
    # The upstream is referenced BY NAME on purpose: this file is public, so
    # the concrete address lives in a host-local include this repo never
    # touches. One-time setup on the serving host (required, or the config
    # test fails with "host not found"):
    #   echo 'upstream n8n_backend { server <internal-address>:5678; }' \
    #     | sudo tee /etc/nginx/conf.d/n8n-upstream.conf
    # After that, copying this file into sites-available always validates —
    # no placeholder substitution step to forget.
    #
    # EXACT match on purpose. The old prefix location forwarded ANY
    # /api/webhook/<name> to n8n, which exposed the alert and summary hooks
    # (no auth on the n8n side): a crafted POST could put a fake "PELIGRO
    # RAYOS" in the Telegram channel. Only the feedback form needs a public
    # route; alerts and the daily summary reach n8n from the ingestor
    # directly. Adding a public hook = adding one more exact location here.
    location = /api/webhook/meteomap-feedback {
        limit_req zone=webhook_limit burst=3 nodelay;
        proxy_pass http://n8n_backend/webhook/meteomap-feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Widget: allow iframe embedding on external sites ──
    location = /widget.html {
        # Override server-level X-Frame-Options (SAMEORIGIN → removed for widget)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors *" always;
        try_files $uri =404;
    }

    # ── OpenSky Network — Aviation aircraft tracking ──────────
    location /opensky-api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass https://opensky-network.org/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host opensky-network.org;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache src_cache;
        proxy_cache_valid 200 15s;
        proxy_cache_valid any 30s;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── CESGA THREDDS — SWAN wave model WMS tiles ───
    location /swan-api/ {
        # A tile layer asks for a whole viewport at once (40-60 tiles on a
        # desktop screen, a new set on every pan or zoom). With a burst of 20
        # most of each set was refused, and the map kept re-asking for the
        # refused ones. Tiles are cached here 30 min, so the burst costs the
        # model server nothing after the first.
        limit_req zone=api_limit burst=120 nodelay;
        proxy_pass https://thredds-meteo.cesga.es/;
        proxy_ssl_server_name on;
        proxy_set_header Host thredds-meteo.cesga.es;
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        proxy_cache mg_cache;
        proxy_cache_valid 200 30m;
        # No http_5xx here: with it, an expired entry is served stale WITHOUT
        # being replaced, so every request goes upstream anyway (measured on
        # the tide route, 22-sep). proxy_cache_lock makes a crowd arriving on
        # a cold entry cost ONE request upstream, not one each.
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        # The provider's cookie must not reach the visitor, and must not stop
        # us — or the edge — from storing the answer. Same for its cache
        # headers: we decide, above.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $thirdparty_cache_control always;
    }

    # ── SPA fallback ─────────────────────────────────
    # The app lives at / (with ?sector=, ?spot= and #hash) and the guide at
    # /guia and /guia/<section>. Those serve the page; any other path that is
    # not a real file is a 404. It used to be the page for EVERY unknown path,
    # so a scanner probing thousands of made-up urls got a 200 each time and
    # nothing could tell a scan from a visitor.
    location = / {
        try_files /index.html =404;
    }
    location = /guia {
        try_files /index.html =404;
    }
    location /guia/ {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }
}
