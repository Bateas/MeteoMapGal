    <!-- The saved theme, before the first paint: no flash of the other one. Same key and default as themeStore. -->

      (function () {
        var theme = 'dark';
        try {

        } catch (e) { /* nothing saved, or storage blocked */ }
        document.documentElement.setAttribute('data-theme', theme);

    <!-- Loading screen, on screen before any of the app's code has run. The same classes are used by
         components/common/LoadingScreen.tsx, which takes over in the same place, so nothing jumps.
         Its colours repeat those of src/styles/v3tokens.css: bootTokens.test.ts keeps them equal. -->
    <style>
      :root { color-scheme: dark; --g-bg: #141618; --g-ink: #e4e8e5; --g-muted: #a2a8a4; --g-hair: #30353a; --g-rule: #687070; --g-s-flojo: #62a8f5; --g-s-navegable: #37bd78; --g-s-bueno: #f5b82e; }
      :root[data-theme="light"] { color-scheme: light; --g-bg: #f4f5f3; --g-ink: #121416; --g-muted: #4e545a; --g-hair: #cbd0ca; --g-rule: #121416; --g-s-flojo: #3480d2; --g-s-navegable: #128f5a; --g-s-bueno: #b67c00; }
      html { background: var(--g-bg); }
      .gc-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
        background: var(--g-bg); color: var(--g-ink);
        font-family: 'Archivo', 'DM Sans', system-ui, -apple-system, sans-serif;
      }
      .gc-boot-mark { display: block; width: 56px; height: 56px; }
      .gc-boot-mark path:nth-child(1), .gc-boot-mark path:nth-child(4) { stroke: var(--g-s-flojo); }
      .gc-boot-mark path:nth-child(2) { stroke: var(--g-s-navegable); }
      .gc-boot-mark path:nth-child(3) { stroke: var(--g-s-bueno); }
      .gc-boot-name { margin: 12px 0 0; font-size: 22px; font-weight: 800; line-height: 1.2; letter-spacing: -.015em; }
      .gc-boot-state { margin: 6px 0 0; min-height: 20px; font-size: 14px; font-weight: 500; line-height: 20px; color: var(--g-muted); }
      .gc-boot-bar { width: 160px; height: 3px; margin-top: 14px; background: var(--g-hair); overflow: hidden; }
      .gc-boot-bar i { display: block; height: 100%; background: var(--g-ink); transform-origin: left; }
      /* One slow fill, once: a sign of life until the app can report what is really happening */
      #loading-skeleton .gc-boot-bar i { animation: gc-boot-fill 4s cubic-bezier(.2, 0, 0, 1) both; }
      @keyframes gc-boot-fill { from { transform: scaleX(0); } to { transform: scaleX(.3); } }
      @media (prefers-reduced-motion: reduce) { #loading-skeleton .gc-boot-bar i { animation: none; transform: scaleX(.3); } }
      .gc-boot-retry {
        min-height: 44px; margin-top: 14px; padding: 0 16px;
        border: 1px solid var(--g-rule); border-radius: 4px; background: transparent; color: inherit;
        font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .gc-boot-retry[hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- On screen until React renders something: LoadingScreen if all goes well, the error boundary if not -->
    <div id="loading-skeleton" class="gc-boot" role="status">
      <svg class="gc-boot-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
        <path d="M18 16 Q30 12, 40 16 Q45 18, 43 13 Q41 9, 36 12" stroke-width="3.5"/>
        <path d="M14 28 Q30 22, 46 28 Q53 31, 50 24 Q47 18, 42 22" stroke-width="4"/>
        <path d="M10 40 Q28 33, 50 40 Q56 42, 54 36 Q51 30, 46 34" stroke-width="4.5"/>
        <path d="M8 52 Q16 46, 24 52 Q32 58, 40 52 Q48 46, 56 52" stroke-width="3"/>
      </svg>
      <p class="gc-boot-name">MeteoMapGal</p>
      <p class="gc-boot-state" id="loading-skeleton-state">Cargando…</p>
      <div class="gc-boot-bar" id="loading-skeleton-bar" aria-hidden="true"><i></i></div>
      <button type="button" class="gc-boot-retry" id="loading-skeleton-retry" hidden>Reintentar</button>
      <noscript>
        <style>#loading-skeleton-state, #loading-skeleton-bar { display: none; }</style>
        <p class="gc-boot-state">MeteoMapGal necesita JavaScript para funcionar.</p>
      </noscript>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
    <script>
      (function () {
        var root = document.getElementById('root');
        var screen = document.getElementById('loading-skeleton');
        var timer;
        // LoadingScreen is the same picture in the same place, so this goes without a fade
        var observer = new MutationObserver(function () {
          if (!root.children.length) return;
          observer.disconnect();
          clearTimeout(timer);
          screen.remove();
        });
        observer.observe(root, { childList: true });
        // The app never arrived (no connection, a file that does not load): say so, never stay here for ever
        function failed() {
          document.getElementById('loading-skeleton-state').textContent = 'La app no ha llegado a abrirse. Comprueba la conexión.';
          document.getElementById('loading-skeleton-bar').hidden = true;
          var retry = document.getElementById('loading-skeleton-retry');
          retry.hidden = false;
          retry.onclick = function () { location.reload(); };
        }
        timer = setTimeout(failed, 20000);
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && t.type === 'module' && !root.children.length) failed();
        }, true);
      })();
    </script>
