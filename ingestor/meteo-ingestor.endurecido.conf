# Hardening for meteo-ingestor, installed as
# /etc/systemd/system/meteo-ingestor.service.d/endurecido.conf
# Way back: delete that file, systemctl daemon-reload, systemctl restart meteo-ingestor.
# Never systemctl revert: it also removes the MemoryMax set in system.control.
[Service]
# A throwaway user per start, no shell, no home. Nothing here writes to disk
# (the log is opened by systemd); if that changes, StateDirectory=, never ReadWritePaths.
DynamicUser=yes
# Only this service's keys, root-owned 600, read by systemd before it drops to the user.
EnvironmentFile=
EnvironmentFile=/etc/meteomapgal/ingestor.env
ReadWritePaths=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
# Not MemoryDenyWriteExecute: V8 compiles to memory it writes and then runs.
